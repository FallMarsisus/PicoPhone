[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
board_build.filesystem_size = 0.5m
board_build.f_cpu = 200000000L

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.9
    bblanchon/ArduinoJson
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    earlephilhower/ESP8266Audio @ ^1.9.7

build_flags =
    ; --- CONFIG ECRAN WAVESHARE ---
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D RPI_DISPLAY_TYPE=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    
    ; --- COULEURS ---
    ; TFT_RGB : Corrige le Bleu qui était Orange/Rouge
    -D TFT_RGB_ORDER=TFT_RGB 
    -D TFT_INVERSION_OFF
    
    ; LV_COLOR_16_SWAP=1 : les pixels LVGL sont pré-swappés.
    ; RPI_DISPLAY_TYPE utilise spi.transfer() qui envoie byte par byte.
    -D LV_COLOR_16_SWAP=1
    
    ; --- PINS & SPI ---
    -D TFT_SPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=11
    -D TFT_SCLK=10
    -D TFT_CS=9
    -D TFT_DC=8
    -D TFT_RST=15
    -D TFT_BL=13
    -D SPI_FREQUENCY=63000000
    -D SPI_READ_FREQUENCY=2000000
    -D SPI_TOUCH_FREQUENCY=2500000
    
    ; --- LVGL ---
    -D LV_CONF_SKIP
    -D LV_COLOR_DEPTH=16
    -D LV_MEM_SIZE=80000
    -D LV_TICK_CUSTOM=1
    -D LV_DISP_ROT_MAX_BUF=32768
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_28=1